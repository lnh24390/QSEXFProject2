# Native on-the-fly Ultralytics augmentation only; never pre-render training mosaics.
# No dropout override: this project uses detect/segment, not classify.
# Candidate for existing-checkpoint fine-tuning, not a measured accuracy improvement.
# Apply to TRAIN only. Keep original val/test untouched.
hsv_h: 0.01
hsv_s: 0.35
hsv_v: 0.30
degrees: 15.0
translate: 0.08
scale: 0.25
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.5
close_mosaic: 5
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0
rect: false
